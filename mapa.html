<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIS — Mapa GPS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    header { background:#0f172a; color:#fff; padding:12px 16px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    header a { color:#d4af37; }
    #mapa { height: calc(100vh - 52px); }
    .leyenda { position:absolute; z-index:1000; right:12px; top:68px; background:#fff; padding:10px 12px; border-radius:8px; max-width:260px; font-size:13px; box-shadow:0 2px 10px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <header>
    <strong>GIS — seguimiento en tiempo real (Sheets)</strong>
    <span><a href="index.html">Kiosco</a> · <a href="oficina.html">Oficina</a></span>
  </header>
  <div id="mapa"></div>
  <div class="leyenda" id="leyenda">Cargando…</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    const mapa = L.map("mapa").setView([40.4168, -3.7038], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap" }).addTo(mapa);
    const capas = L.layerGroup().addTo(mapa);
    const polilineas = {};
    function pintar(data) {
      capas.clearLayers();
      const list = (data && data.puntos) || [];
      const ley = document.getElementById("leyenda");
      if (!list.length) {
        ley.textContent = "Nadie emitiendo GPS (30 min). Abre el kiosco, inicia servicio y acepta ubicación.";
        return;
      }
      ley.innerHTML = "<strong>En mapa</strong><br>" + list.map(function (p) {
        return p.nombre + " · " + (p.servicio_nombre || "") + "<br><small>" + p.timestamp + "</small>";
      }).join("<hr>");
      const box = [];
      list.forEach(function (p) {
        if (isNaN(p.latitud) || isNaN(p.longitud)) return;
        capas.addLayer(L.marker([p.latitud, p.longitud]).bindPopup("<b>" + p.nombre + "</b>"));
        box.push([p.latitud, p.longitud]);
        gisApi({ action: "recorrido", id: p.empleado_id }).then(function (hist) {
          const latlngs = (hist.puntos || []).map(function (x) { return [x.latitud, x.longitud]; }).filter(function (x) { return !isNaN(x[0]); });
          if (latlngs.length > 1) {
            if (polilineas[p.empleado_id]) mapa.removeLayer(polilineas[p.empleado_id]);
            polilineas[p.empleado_id] = L.polyline(latlngs, { color: "#16213e", weight: 3 }).addTo(mapa);
          }
        });
      });
      if (box.length) mapa.fitBounds(box, { padding: [40, 40], maxZoom: 16 });
    }
    function refrescar() {
      gisApi({ action: "gpsVivos", minutos: 30 }).then(pintar).catch(function (e) {
        document.getElementById("leyenda").textContent = e.message;
      });
    }
    refrescar();
    setInterval(refrescar, 5000);
  </script>
</body>
</html>
